<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle del Curso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #6c5ce7, #00b894);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    .card {
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
      background-color: #fff;
      color: #222;
    }

    h1, h4 {
      color: #333;
      font-weight: 700;
    }

    .btn-primary {
      background-color: #6c5ce7;
      border-color: #6c5ce7;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .btn-primary:hover {
      background-color: #5a4ccf;
      border-color: #5a4ccf;
    }

    .btn-success {
      background-color: #00b894;
      border-color: #00b894;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .btn-success:hover {
      background-color: #019875;
      border-color: #019875;
    }

    .estrella {
      font-size: 2.5rem;
      color: #ccc;
      cursor: pointer;
      transition: color 0.2s;
      user-select: none;
    }

    .estrella.seleccionada {
      color: gold;
      text-shadow: 0 0 5px #ffd700aa;
    }

    #valoracion {
      margin-top: 2rem;
    }

    ul.list-group-item {
      font-weight: 500;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card p-4 mb-4">
      <h1 class="mb-3 text-center">Nombre del Curso</h1>
      <p><strong>Descripción:</strong> Aprende desarrollo web desde cero.</p>

      <h4 class="mt-4">Clases Incluidas</h4>
      <ul class="list-group list-group-flush mb-3">
        <li class="list-group-item">Introducción</li>
        <li class="list-group-item">HTML y CSS</li>
        <li class="list-group-item">JavaScript Básico</li>
        <li class="list-group-item">Proyecto Final</li>
      </ul>

      <div class="d-flex justify-content-center gap-3">
        <form action="../Backend/procesar_pago.php" method="POST" class="m-0">
        <input type="hidden" name="curso_id" value="1" />
        <button type="submit" class="btn btn-primary me-2">Comprar</button>
        </form>
        
        <a href="mis_cursos.html" class="btn btn-success px-4">Acceder</a>
      </div>
    </div>

    <!-- Sección de Valoración -->
    <div id="valoracion" class="card p-4 shadow-sm">
      <h4 class="mb-3 text-center">Valora este curso</h4>
      <form id="formValoracion" method="POST" action="../Backend/valoraciones.php">
        <div class="mb-3 text-center">
          <label class="form-label d-block mb-2">Puntuación:</label>
          <div id="estrellas" class="d-inline-flex gap-2">
            <span class="estrella" data-valor="1">&#9733;</span>
            <span class="estrella" data-valor="2">&#9733;</span>
            <span class="estrella" data-valor="3">&#9733;</span>
            <span class="estrella" data-valor="4">&#9733;</span>
            <span class="estrella" data-valor="5">&#9733;</span>
          </div>
          <input type="hidden" name="puntuacion" id="puntuacion" value="0" />
        </div>

        <div class="mb-3">
          <label for="comentario" class="form-label">Comentario:</label>
          <textarea
            name="comentario"
            class="form-control"
            rows="3"
            required
            placeholder="Escribe tu opinión..."
          ></textarea>
        </div>

        <input type="hidden" name="curso_id" value="1" />
        <input type="hidden" name="usuario_id" value="2" />

        <button type="submit" class="btn btn-success w-100">Enviar Valoración</button>
      </form>
    </div>
  </div>

  <script>
    const estrellas = document.querySelectorAll('.estrella');
    const puntuacion = document.getElementById('puntuacion');

    estrellas.forEach(estrella => {
      estrella.addEventListener('click', () => {
        const valor = estrella.getAttribute('data-valor');
        puntuacion.value = valor;

        estrellas.forEach(e => e.classList.remove('seleccionada'));
        for (let i = 0; i < valor; i++) {
          estrellas[i].classList.add('seleccionada');
        }
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
