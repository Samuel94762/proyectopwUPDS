<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestionar Curso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-secondary text-white">
        <h3 class="mb-0">Añadir Clase al Curso</h3>
      </div>
      <div class="card-body">
        <form action="../Backend/profesor.php" method="POST">
          <input type="hidden" name="accion" value="crear_clase">

          <div class="mb-3">
            <label for="curso_id" class="form-label">ID del Curso</label>
            <input type="number" class="form-control" id="curso_id" name="curso_id" required>
          </div>

          <div class="mb-3">
            <label for="titulo_clase" class="form-label">Título de la Clase</label>
            <input type="text" class="form-control" id="titulo_clase" name="titulo_clase" required>
          </div>

          <div class="mb-3">
            <label for="tipo" class="form-label">Tipo de Recurso</label>
            <select class="form-select" id="tipo" name="tipo" required>
              <option value="video">Video</option>
              <option value="audio">Audio</option>
              <option value="texto">Texto</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="url" class="form-label">URL del Recurso</label>
            <input type="url" class="form-control" id="url" name="url" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Agregar Clase</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (opcional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
