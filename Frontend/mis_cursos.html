<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Cursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="mb-4 text-center">Mis Cursos</h1>

    <div id="cursos-container" class="row gy-4">
      <!-- Aquí se mostrarán los cursos -->
    </div>
  </div>

  <script>
    // Simulación: cursos comprados (esto se puede reemplazar luego por datos reales del backend)
    const cursosComprados = [
      {
        nombre: "Curso de PHP",
        descripcion: "Aprende a desarrollar sitios web dinámicos con PHP desde cero."
      },
      {
        nombre: "Curso de MySQL",
        descripcion: "Aprende a gestionar bases de datos relacionales con MySQL."
      }
    ];

    const contenedor = document.getElementById('cursos-container');

    if (cursosComprados.length === 0) {
      contenedor.innerHTML = `
        <div class="col-12 text-center">
          <div class="alert alert-info">No has comprado ningún curso aún.</div>
        </div>`;
    } else {
      cursosComprados.forEach(curso => {
        const div = document.createElement('div');
        div.classList.add('col-md-6');
        div.innerHTML = `
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title">${curso.nombre}</h5>
              <p class="card-text">${curso.descripcion}</p>
              <a href="#" class="btn btn-primary">Ir al curso</a>
            </div>
          </div>
        `;
        contenedor.appendChild(div);
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
