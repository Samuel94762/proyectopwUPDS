<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Mantenemos los mismos estilos pero ajustamos algunas clases */
        .card-curso {
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .badge-gratis {
            background-color: #28a745;
        }
        .badge-pago {
            background-color: #007bff;
        }
        .rating {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <?php include('../components/header.html'); ?>
    
    <div class="container mt-4">
        <h1 class="mb-4">Explora Nuestros Cursos</h1>
        
        <!-- Filtros -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <label for="categoria" class="form-label">Categoría</label>
                        <select class="form-select" id="categoria">
                            <option value="">Todas las categorías</option>
                            <!-- Se llenará con JavaScript -->
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select class="form-select" id="tipo">
                            <option value="">Todos</option>
                            <option value="gratis">Gratis</option>
                            <option value="pago">De pago</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Listado de cursos -->
        <div class="row" id="cursos-container">
            <!-- Se llenará con JavaScript -->
        </div>
        
        <!-- Mensaje cuando no hay cursos -->
        <div class="text-center py-5 d-none" id="sin-cursos">
            <i class="fas fa-book-open fa-3x mb-3 text-muted"></i>
            <h3>No se encontraron cursos</h3>
            <p class="text-muted">Intenta con otros filtros de búsqueda</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            cargarCursos();
            
            // Event listeners para los filtros
            document.getElementById('categoria').addEventListener('change', cargarCursos);
            document.getElementById('tipo').addEventListener('change', cargarCursos);
        });
        
        function cargarCursos() {
            const categoria = document.getElementById('categoria').value;
            const tipo = document.getElementById('tipo').value;
            
            fetch(`../Backend/cursos.php?categoria=${categoria}&tipo=${tipo}`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('cursos-container');
                    const sinCursos = document.getElementById('sin-cursos');
                    
                    if (data.success && data.count > 0) {
                        container.innerHTML = '';
                        sinCursos.classList.add('d-none');
                        
                        // Llenar categorías si es la primera carga
                        if (document.getElementById('categoria').options.length <= 1 && data.categorias) {
                            const select = document.getElementById('categoria');
                            data.categorias.forEach(cat => {
                                const option = document.createElement('option');
                                option.value = cat;
                                option.textContent = cat;
                                select.appendChild(option);
                            });
                        }
                        
                        // Mostrar cursos
                        data.data.forEach(curso => {
                            container.innerHTML += crearCardCurso(curso);
                        });
                    } else {
                        container.innerHTML = '';
                        sinCursos.classList.remove('d-none');
                    }
                });
        }
        
        function crearCardCurso(curso) {
            const precio = curso.tipo === 'gratis' ? 
                '<span class="badge badge-gratis bg-success">GRATIS</span>' : 
                `<span class="text-primary fw-bold">$${curso.precio.toFixed(2)}</span>`;
            
            const rating = Array(5).fill('').map((_, i) => 
                i < Math.floor(curso.rating) ? 
                '<i class="fas fa-star"></i>' : 
                '<i class="far fa-star"></i>'
            ).join('');
            
            return `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card h-100 card-curso">
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="badge bg-secondary">${curso.categoria || 'Sin categoría'}</span>
                                ${precio}
                            </div>
                            <h5 class="card-title">${curso.titulo}</h5>
                            <p class="card-text text-muted">${curso.descripcion.substring(0, 100)}...</p>
                            <div class="mb-2">
                                ${rating} ${curso.rating ? `(${curso.rating.toFixed(1)})` : '(Sin calificar)'}
                            </div>
                            <small class="text-muted">Instructor: ${curso.instructor}</small>
                        </div>
                        <div class="card-footer bg-white">
                            <a href="detalle_curso.php?id=${curso.id}" class="btn btn-primary w-100">Ver curso</a>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
